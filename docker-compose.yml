# Instructions:
#
# 1. Copy .env.example to .env
# 2. Add your admin password to .env
# 3. docker compose up -d
# 4. docker compose logs (to verify all started)
# 5. connect to localhost:6363, login with admin and the .env password
#

services:
  terminusdb-server:
    image: terminusdb/terminusdb-server:12.1-rc
    container_name: terminusdb-server
    pull_policy: always
    hostname: terminusdb-server
    tty: true
    ports:
      - 6363:6363
    env_file: .env
    environment:
      - TERMINUSDB_SERVER_PORT=6363
      # DISABLE THESE ENV VARIABLES WHEN RUNNING TERMINUSDB IN PRODUCTION
      # OR PUT AN AUTHENTICATION GATEWAY IN FRONT OF TERMINUSDB
      - TERMINUSDB_INSECURE_USER_HEADER=X-User-Forward
      - TERMINUSDB_INSECURE_USER_HEADER_ENABLED=true

      # Admin-Password should be changed before exposing to the internet:
      # (Create a .env file from .env.example and add a password)
      - "TERMINUSDB_ADMIN_PASS=${TERMINUSDB_ADMIN_PASS:?error}"

      # Built-in vectorlink engine (embedded search plugin, no separate
      # service or credentials needed). Its store lives at
      # /app/terminusdb/storage/vectorlink inside the terminusdb-storage volume.
      - TERMINUSDB_INDEXER_BACKEND=vectorlink

      # Embedding provider for the built-in vectorlink engine. The engine
      # POSTs to ${VECTORLINK_EMBED_URL}/v1/embeddings — the defaults point at
      # the bundled ollama sidecar below (nomic-embed-v2, dim 768, no key).
      - VECTORLINK_EMBED_PROVIDER=openai_compatible
      - VECTORLINK_EMBED_URL=http://embeddings:11434
      - VECTORLINK_MODEL=nomic-embed-v2
      - VECTORLINK_DIM=768

      # To use OpenAI instead (any OpenAI-compatible endpoint works the same):
      #   - VECTORLINK_EMBED_PROVIDER=openai
      #   - VECTORLINK_EMBED_URL=https://api.openai.com
      #   - VECTORLINK_MODEL=text-embedding-3-small
      #   - VECTORLINK_DIM=1536
      #   - "VECTORLINK_EMBED_API_KEY=${OPENAI_KEY}"
      # ...and remove or scale-to-zero the embeddings services below.

      # IMPORTANT: the embedding parameters above are locked into the
      # vectorlink store at first initialization (vectorlink-params.json) —
      # every stored vector is only valid for the provider/model/dim that
      # produced it. Changing them on an existing store aborts engine init.
      # To switch: stop the stack, delete the store, start with the new
      # parameters; all documents are re-embedded on reindex:
      #   docker compose down
      #   docker run --rm -v "$(basename "$PWD")_terminusdb-storage":/storage alpine rm -rf /storage/vectorlink
      #   docker compose up -d
    volumes:
      - terminusdb-storage:/app/terminusdb/storage
    restart: unless-stopped

  # Ollama embedding sidecar — serves nomic-embed-v2 via /v1/embeddings.
  # CPU-only (no GPU required). The model is pulled on first start by embeddings-init.
  embeddings:
    image: ollama/ollama:latest
    pull_policy: missing
    container_name: terminusdb-ollama
    hostname: terminusdb-ollama
    environment:
      # Keep the model resident indefinitely (never unload on idle).
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # One-shot init: pull the nomic model if not already present.
  embeddings-init:
    image: ollama/ollama:latest
    pull_policy: missing
    depends_on:
      embeddings:
        condition: service_healthy
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://embeddings:11434
    entrypoint: ["bash", "-c"]
    command:
      - |
        ollama pull hf.co/nomic-ai/nomic-embed-text-v2-moe-GGUF:Q8_0 || true
        ollama cp hf.co/nomic-ai/nomic-embed-text-v2-moe-GGUF:Q8_0 nomic-embed-v2 2>/dev/null || true
        echo "Model ready."
    restart: "no"

  # --- Legacy / optional services (commented out) ---

  # legacy_vectorlink:
  #   image: terminusdb/vectorlink:v0.0.8
  #   env_file: .env
  #   environment:
  #     - TERMINUSDB_CONTENT_ENDPOINT=http://terminusdb-server:6363/api/index
  #     - TERMINUSDB_USER_FORWARD_HEADER=X-User-Forward
  #   volumes:
  #     - ./vector_storage:/app/storage
  #   command: ["./terminusdb-semantic-indexer", "serve", "--directory", "/app/storage"]

  # change-request-api:
  #   image: terminusdb/terminusdb-change-request-api:v0.0.9
  #   restart: always
  #   env_file: .env
  #   ports:
  #     - 6365:3035
  #   environment:
  #     - SERVER_ENDPOINT=http://terminusdb-server:6363
  #     - USE_CHANGE_REQUEST=${USE_CHANGE_REQUEST:-true}
  #     - OPENAI_SERVER_URL=http://vectorlink:8080
  #     - "USER_KEY=${TERMINUSDB_ADMIN_PASS:?error}"

  # There are multiple ways to configure TerminusDB security through
  # environment variables. Several reasonable options are included below.
  # Uncomment the option you decide on and comment out others.
  # Don't forget to change the default password in the .env file

  # TerminusDB should be set up behind a TLS-terminating reverse
  # proxy with admin authentication provided by password.

  # The storage path of terminusdb databases is /app/terminusdb/storage in case
  # you want to persist storage somewhere else.

  # To change the terminusdb password if already set, to match the .env:
  # docker compose exec -ti terminusdb-server ./terminusdb user password admin -p [FancyPassword]

volumes:
  terminusdb-storage:
  ollama-models:
