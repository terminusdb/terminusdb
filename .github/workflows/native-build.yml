name: Native Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # ready_for_review is not a default type; without it, marking a draft
    # ready would not re-run the pipeline and the image tests never fire.
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

jobs:
  build:
    name: "Build"
    strategy:
      # Run all jobs even when some jobs fail.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            swipl_release: stable
          - os: macos-latest
            swipl_release: homebrew
#            - os: ubuntu-latest
#            swipl_release: devel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for file changes
        id: check_changes
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            git fetch --deepen=10
            # Check that HEAD~1 exists
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
            else
              echo "Only one commit available; treating all files as changed"
              CHANGED_FILES=$(git diff --name-only HEAD)
            fi
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            # For pull requests, fetch the base commit and compare to head
            git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          fi

          # Superset of both test jobs' filters: if either considers the
          # change relevant, the build artifact must exist.
          RELEVANT_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^(src/|tests/|distribution/|Makefile|\.github/workflows/)' || true)
          if [ -n "$RELEVANT_CHANGED" ]; then
            echo "Relevant files changed: $RELEVANT_CHANGED"
            echo "relevant_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No relevant files changed"
            echo "relevant_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install swi-prolog
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        run: ./.github/install-swi-prolog.sh ${{ matrix.swipl_release }}

      - name: Checkout tus
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: terminusdb-org/tus
          path: tus
          ref: v0.0.17

      - name: Install tus
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        run: swipl -g "pack_install('file://$GITHUB_WORKSPACE/tus', [interactive(false)])"

      - name: Install Protobuf Compiler (Linux)
        if: ${{runner.os == 'Linux' &&  steps.check_changes.outputs.relevant_changed == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Protobuf Compiler (macOS)
        if: ${{ runner.os == 'macOS' && steps.check_changes.outputs.relevant_changed == 'true' }}
        run: brew install protobuf

      - name: Cache Rust build
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust
          # Share one cache entry across jobs: v2 defaults add-job-id-key
          # to true, which would give each job its own key.
          add-job-id-key: false

      - name: Build
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        run: make

      - name: Upload build artifact
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: terminusdb-build-${{ matrix.os }}
          retention-days: 1
          path: |
            terminusdb
            src/rust/librust.*
            src/rust/.last-dist

  unit-tests:
    name: "Unit Tests"
    needs: build
    strategy:
      # Run all jobs even when some jobs fail.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            swipl_release: stable
          - os: macos-latest
            swipl_release: homebrew
#            - os: ubuntu-latest
#            swipl_release: devel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for file changes
        id: check_changes
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            git fetch --deepen=10
            # Check that HEAD~1 exists
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
            else
              echo "Only one commit available; treating all files as changed"
              CHANGED_FILES=$(git diff --name-only HEAD)
            fi
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            # For pull requests, fetch the base commit and compare to head
            git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          fi

          RELEVANT_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^(src/|tests/|distribution/|Makefile|\.github/workflows/native\-build\.yml)' || true)
          if [ -n "$RELEVANT_CHANGED" ]; then
            echo "Relevant files changed: $RELEVANT_CHANGED"
            echo "relevant_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No relevant files changed"
            echo "relevant_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install swi-prolog
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        run: ./.github/install-swi-prolog.sh ${{ matrix.swipl_release }}

      - name: Checkout tus
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: terminusdb-org/tus
          path: tus
          ref: v0.0.17

      - name: Install tus
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        run: swipl -g "pack_install('file://$GITHUB_WORKSPACE/tus', [interactive(false)])"

      - name: Install Protobuf Compiler (Linux)
        if: ${{runner.os == 'Linux' &&  steps.check_changes.outputs.relevant_changed == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Protobuf Compiler (macOS)
        if: ${{ runner.os == 'macOS' && steps.check_changes.outputs.relevant_changed == 'true' }}
        run: brew install protobuf

      - name: Cache Rust build
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust
          # Restore-only consumer of the build job's cache entry (same OS +
          # workspaces + Cargo.lock → same key once the job id is excluded).
          add-job-id-key: false
          save-if: false

      - name: Build
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        run: make

      - name: Unit tests
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        run: make test

  inter-tests:
    name: "Integration Tests"
    needs: build
    if: github.event_name == 'pull_request'

    strategy:
      # Run all jobs even when some jobs fail.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            swipl_release: stable
          - os: macos-latest
            swipl_release: homebrew
#            - os: ubuntu-latest
#            swipl_release: devel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for file changes
        id: check_changes
        run: |
          git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          RELEVANT_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^(src/|tests/|distribution/|Makefile|\.github/workflows/)' || true)
          if [ -n "$RELEVANT_CHANGED" ]; then
            echo "Relevant files changed: $RELEVANT_CHANGED"
            echo "relevant_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No relevant files changed"
            echo "relevant_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install swi-prolog
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        run: ./.github/install-swi-prolog.sh ${{ matrix.swipl_release }}

      - name: Checkout tus
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: terminusdb-org/tus
          path: tus
          ref: v0.0.17

      - name: Install tus
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        run: swipl -g "pack_install('file://$GITHUB_WORKSPACE/tus', [interactive(false)])"

      - name: Download build artifact
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: terminusdb-build-${{ matrix.os }}
          path: .

      - name: Make binary executable
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        run: chmod +x terminusdb

      - name: Init TerminusDB
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        run: |
          ./terminusdb store init

      - name: Start TerminusDB
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}                        
        run: |
          ./terminusdb serve &
          echo $! > terminusdb.pid
          sleep 5  # wait for server to start

      - name: Install NodeJS
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        run: |
            cd tests        
            npm install-ci-test

      - name: Stop TerminusDB
        if: ${{ steps.check_changes.outputs.relevant_changed == 'true' }}
        run: |
            kill $(cat terminusdb.pid)

  # Docker images build on every PR, kicked off right after the native
  # build (parallel to the test jobs — the image compiles its own Rust).
  # On draft PRs the image test suite is skipped (build only); on ready
  # PRs images are built and tested. Manual runs stay available via
  # workflow_dispatch on the docker-* workflows.
  docker-amd64:
    name: "AMD64 Image"
    needs: build
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/docker-amd64-build.yml
    with:
      run_tests: ${{ github.event.pull_request.draft == false }}

  docker-arm64:
    name: "ARM64 Image"
    needs: build
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/docker-arm64-build.yml
    with:
      run_tests: ${{ github.event.pull_request.draft == false }}
