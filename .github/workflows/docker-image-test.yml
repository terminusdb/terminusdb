name: Docker Image Test

on:
  workflow_call:
    inputs:
      test_repository:
        required: true
        type: string
      test_ref:
        required: true
        type: string
      image_artifact:
        required: true        
        type: string
      image_platform:
        required: true                
        type: string
      runner:
        type: string
        required: true
      mocha_jobs:
        type: string
        default: "4"

jobs:

  integration_tests_basic:
    name: Integration Tests
    runs-on: ${{ inputs.runner }}

    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.test_repository }}
          ref: ${{ inputs.test_ref }}

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.image_artifact }}

      - name: Set up QEMU
        if: ${{ inputs.image_platform == 'linux/arm64' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64'

      - name: Remove old TerminusDB container if exists
        run: |
          docker rm -f terminusdb || true
        
      - name: Build test image
        # The suite runs inside one container: CLI invocations are local
        # spawns instead of `docker exec` per command. tmpfs mounts put the
        # server store and per-suite test stores in RAM (no fsync cost).
        # TERMINUSDB_ENABLE_OPTIMIZER=false: the probabilistic post-commit
        # optimize/GC breaks tests that assert on deterministic data versions.
        run: |
          docker load < ${{ inputs.image_artifact }}.tar.gz
          docker build --platform ${{ inputs.image_platform }} \
            --build-arg TERMINUSDB_IMAGE=terminusdb/terminusdb-server:local \
            -f tests/Dockerfile.test \
            -t terminusdb-test:local .
          mkdir -p test-logs
          # terminus_config.pl is read by lib/info.js for version checks;
          # TERMINUSDB_GIT_HASH replaces `git rev-parse` (no .git inside).
          docker run --platform ${{ inputs.image_platform }} \
            --volume "${PWD}/tests:/app/terminusdb/tests" \
            --volume "${PWD}/src/config/terminus_config.pl:/app/terminusdb/src/config/terminus_config.pl:ro" \
            --volume "${PWD}/test-logs:/logs" \
            --tmpfs /tmp:rw,exec \
            --tmpfs /app/terminusdb/storage \
            --name=terminusdb \
            --net=host \
            -e TERMINUSDB_PLUGINS_PATH=/plugins \
            -e TERMINUSDB_ENABLE_OPTIMIZER=false \
            -e TERMINUSDB_TEST_TMPDIR=/tmp \
            -e TERMINUSDB_GIT_HASH=$(git rev-parse HEAD) \
            -e MOCHA_JOBS=${{ inputs.mocha_jobs }} \
            terminusdb-test:local \
            sh /app/terminusdb/tests/run-docker-tests.sh

      - name: Capture TerminusDB logs
        if: always()
        run: |
          cp test-logs/server.log terminusdb-server.log 2>/dev/null || echo "Failed to capture logs"

      - name: Upload TerminusDB server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminusdb-server-logs-${{ inputs.image_artifact }}
          path: terminusdb-server.log
          retention-days: 7
