[package]
name = "terminusdb-vectorlink"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Embedded vectorlink engine, built from git source.
# shortcut: pinned rev; bump manually when pulling vectorlink updates.
vectorlink = { git = "https://github.com/terminusdb-org/vectorlink", rev = "a5582442642df369de450947b67dce0e0d70dbc0" }
terminusdb-webserver = { path = "../terminusdb-webserver" }
swipl = { version = "0.3.16", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
nix = { version = "0.31", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
