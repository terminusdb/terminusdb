[workspace]
members = ["terminusdb-community", "terminusdb-store-prolog", "terminusdb-dylib", "terminusdb-webserver", "terminusdb-vectorlink"]
# v2 required for per-platform dep features: v1 unifies them across all
# targets, leaking tikv-jemallocator/background_threads into macOS builds.
resolver = "2"

[profile.release]
# Line tables only — full debuginfo across the dep tree bloats CI builds and
# the shipped .so is stripped of it anyway (Dockerfile strip --strip-debug).
debug = 1

[patch.crates-io]
tdb-succinct = {git="https://github.com/terminusdb-org/tdb-succinct", tag="v0.2.1"}
terminus-store = {git="https://github.com/terminusdb-org/terminusdb-store", tag="v0.23.1"}
swipl = {git="https://github.com/terminusdb-org/swipl-rs"}
#swipl = {path="../../../swipl-rs/swipl"}

#[patch."https://github.com/terminusdb-org/tdb-succinct"]
#tdb-succinct = {path="../../../tdb-succinct"}

# To develop against a local vectorlink checkout instead of the pinned
# rev, uncomment:
#[patch."https://github.com/terminusdb-org/vectorlink"]
#vectorlink = {path="../../../vectorlink"}
