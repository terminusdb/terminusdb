[package]
name = "terminusdb-webserver"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.6.20"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "net", "fs"] }
serde_json = "1.0.149"
swipl = { version = "0.3.16", features = ["serde"] }
futures = "0.3.31"
lazy_static = "1.4.0"
tokio-stream = "0.1.18"
tower-http = { version = "0.4.4", features = ["cors"] }
percent-encoding = "2.3.1"
hyper = "0.14.32"

[dev-dependencies]
tower = { version = "0.4.13", features = ["util"] }
tempfile = "3.14.0"
