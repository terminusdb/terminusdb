[package]
name = "terminusdb-webserver"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8.1"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "net", "fs"] }
serde_json = "1.0.149"
swipl = { version = "0.3.16", features = ["serde"] }
futures = "0.3.31"
lazy_static = "1.4.0"
tokio-stream = "0.1.18"
tower-http = { version = "0.6.2", features = ["cors", "decompression-gzip", "decompression-deflate"] }
percent-encoding = "2.3.1"
nix = { version = "0.31", features = ["fs"] }
hyper = "1.5.2"
hyper-util = { version = "0.1.10", features = ["full"] }
flate2 = "1.0"
uuid = { version = "1.11.0", features = ["v4"] }
libc = "0.2"
socket2 = "0.6"

[dev-dependencies]
tower = { version = "0.4.13", features = ["util"] }
tempfile = "3.14.0"
