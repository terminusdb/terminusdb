[package]
name = "terminusdb-dylib"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
terminusdb-community = {path="../terminusdb-community"}
terminusdb-store-prolog = {path="../terminusdb-store-prolog"}
terminusdb-webserver = {path="../terminusdb-webserver"}

# background_threads is Linux-only (requires resolver="2" in the workspace so
# target-gated dep features don't leak to other platforms). The embedded
# jemalloc has no pthread bg-thread support on macOS and warns
# `<jemalloc>: option background_thread currently supports pthread only` on
# every process start, which breaks tests that regex-match stderr.
# Nix/packaging opt-out: JEMALLOC_SYS_WITH_MALLOC_CONF="background_thread:false"
# at build time (jemalloc-sys appends env conf after the feature-derived conf).
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["disable_initial_exec_tls", "background_threads"] }

[target.'cfg(all(not(target_env = "msvc"), not(target_os = "linux")))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["disable_initial_exec_tls"] }
